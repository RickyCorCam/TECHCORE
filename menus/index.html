<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda TI</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>

        <h1>Tienda de Hardware y Licencias</h1>

        <!-- MENU -->
        <nav class="menu">

            <button onclick="abrirInventarios()">
                Inventarios
            </button>

            <button onclick="abrirOrdenes()">
                Órdenes
            </button>

        </nav>

    </header>

    <main>

        <!-- PRODUCTOS HARDWARE -->
        <section>
            <h2>Productos Hardware</h2>

            <div id="hardware-container" class="productos">

            </div>
        </section>

        <!-- PRODUCTOS LICENCIAS -->
        <section>
            <h2>Licencias</h2>

            <div id="licencias-container" class="productos">

            </div>
        </section>

        <!-- CARRITO -->
        <section class="carrito">

            <h2>Carrito</h2>

            <ul id="lista-carrito"></ul>

            <h3>
                Total: $<span id="total">0</span>
            </h3>

            <button id="btn-comprar">
                Finalizar Compra
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
